<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>がくしゅうの　きろく</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">がくしゅうの　きろく</p>
            <h1 id="app-title">がくしゅうの　きろく</h1>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="study-form" class="study-form">
          <div class="field-grid">
            <div>
              <label class="field-label" for="entry-date">がくしゅうび</label>
              <input id="entry-date" name="date" type="date" required />
            </div>
            <div>
              <label class="field-label" for="entry-subject">かもく</label>
              <select id="entry-subject" name="subject" required>
                <option value="">えらんでください</option>
                <option value="こくご">こくご</option>
                <option value="さんすう">さんすう</option>
                <option value="せいかつか">せいかつか</option>
                <option value="おんがく">おんがく</option>
                <option value="たいいく">たいいく</option>
                <option value="ずこう">ずこう</option>
                <option value="どうとく">どうとく</option>
                <option value="えいご">えいご</option>
                <option value="そうごうてきながくしゅう">そうごうてきながくしゅう</option>
              </select>
            </div>
          </div>

          <div class="before-class-notice">じゅぎょうのまえにうちましょう</div>
          <label class="field-label" for="entry-task">かだい</label>
          <input id="entry-task" name="task" type="text" maxlength="120" placeholder="れい：ぶんすうのたしざんのしかたをかんがえる" required />

          <label class="field-label" for="entry-goal">かだいが　できるようになるために　がんばること</label>
          <textarea id="entry-goal" name="goal" rows="2" maxlength="200" placeholder="れい：じぶんのかんがえをせつめいできるようにする"></textarea>

          <div class="field-grid">
            <div>
              <label class="field-label" for="entry-understanding">めざすすがた</label>
              <select id="entry-understanding" name="understanding" required>
                <option value="">えらんでください</option>
                <option value="5">どんどん　がんばる</option>
                <option value="1">ゆっくり　がんばる</option>
              </select>
            </div>
          </div>

          <div class="before-class-notice">じゅぎょうの　おわりに　うちましょう</div>
          <div class="field-grid learning-grid">
            <div>
              <label class="field-label" for="entry-learning-method">ひとりで</label>
              <select id="entry-learning-method" name="learningMethod" required>
                <option value="">えらんでください</option>
                <option value="よくわかった">よくわかった</option>
                <option value="まあまあ　わかった">まあまあ　わかった</option>
                <option value="あまり　わからなかった">あまり　わからなかった</option>
                <option value="わからなかった">わからなかった</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="entry-solo-evaluation">ひょうか</label>
              <select id="entry-solo-evaluation" name="soloEvaluation" required>
                <option value="">えらんでください</option>
                <option value="5">よくわかった</option>
                <option value="4">まあまあ　わかった</option>
                <option value="3">あまり　わからなかった</option>
                <option value="1">わからなかった</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="entry-peer-learning">なかまと</label>
              <select id="entry-peer-learning" name="peerLearning" required>
                <option value="">えらんでください</option>
                <option value="よくわかった">よくわかった</option>
                <option value="まあまあ　わかった">まあまあ　わかった</option>
                <option value="あまり　わからなかった">あまり　わからなかった</option>
                <option value="わからなかった">わからなかった</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="entry-peer-evaluation">ひょうか</label>
              <select id="entry-peer-evaluation" name="peerEvaluation" required>
                <option value="">えらんでください</option>
                <option value="5">よくわかった</option>
                <option value="4">まあまあ　わかった</option>
                <option value="3">あまり　わからなかった</option>
                <option value="1">わからなかった</option>
              </select>
            </div>
          </div>

          <label class="field-label" for="entry-reflection">きょう、わかったこと</label>
          <textarea id="entry-reflection" name="reflection" rows="3" maxlength="240" placeholder="きょうは、～がわかった"></textarea>

          <label class="field-label" for="entry-content">まなびかたのふりかえり</label>
          <textarea id="entry-content" name="content" rows="3" maxlength="500" placeholder="きょうは、〇〇さんのおかげで、～がわかった。つぎは、じぶんも・・・したい。"></textarea>
          <div class="note-meta">
            <span id="editing-label">きょうのがくしゅうのきろくをかいています</span>
            <span><span id="char-count">0</span>/500</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">がくしゅうの　きろくをほぞん</button>
            <button class="ghost-button" type="button" id="clear-button">にゅうりょくをけす</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">MY PROGRESS</p>
            <h2 id="history-title">がくしゅうのきろく</h2>
          </div>
          <div class="stats-strip" aria-label="がくしゅうのきろくのけんすう">
            <strong id="entry-count">0</strong>
            <span>けん</span>
          </div>
        </div>

        <p class="progress-label evaluation-header-title" id="progress-title">ほんじのひょうかのへんか</p>
        <section class="progress-card" aria-labelledby="progress-title">
          <label class="chart-subject-filter" for="evaluation-subject-filter">
            <span>かもく</span>
            <select id="evaluation-subject-filter">
              <option value="all">すべてのかもく</option>
            </select>
          </label>
          <label class="chart-period-filter" for="evaluation-period-filter">
            <span>しゅうけいするきかん</span>
            <select id="evaluation-period-filter">
              <option value="all">すべて</option>
              <option value="this-week">こんしゅう</option>
              <option value="last-week">せんしゅう</option>
              <option value="this-month">こんげつ</option>
              <option value="last-month">ぜんげつ</option>
            </select>
          </label>
          <div class="progress-stats">
            <span>ほんじのひょうかのへいきん <strong id="average-evaluation">-</strong>/5</span>
          </div>
          <div class="evaluation-chart" id="evaluation-chart" aria-label="ほんじのひょうかのへんか"></div>
        </section>

        <div class="summary-row" id="summary-row" aria-label="まなびかたのしゅうけい"></div>
        <div class="list-tools">
          <label class="subject-list-filter" for="subject-filter">
            <span>かもく</span>
            <select id="subject-filter" aria-label="かもくでしぼりこみ">
              <option value="all">すべてのかもく</option>
            </select>
          </label>
          <label class="period-filter" for="period-filter">
            <span>しゅうけいするきかん</span>
            <select id="period-filter">
              <option value="all">すべて</option>
              <option value="this-week">こんしゅう</option>
              <option value="last-week">せんしゅう</option>
              <option value="this-month">こんげつ</option>
              <option value="last-month">ぜんげつ</option>
            </select>
          </label>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>まだがくしゅうのきろくがありません</strong>
          <span>まなんだことをほぞんすると、ここにひょうじされます。</span>
        </div>
        <ul id="entry-list" class="entry-list" aria-label="ほぞんしたがくしゅうのきろくいちらん"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
